<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A flip clock with smooth animations.">
  <title>Flip Clock</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="flip-clock">
    <!-- Hours Section -->
    <div class="flip-clock__piece">
      <div class="flip-clock__slot">Hours</div>
      <div class="card flip">
        <span class="card__top" data-value="00">00</span>
        <span class="card__bottom" data-value="00"></span>
        <span class="card__back">
          <span class="card__bottom" data-value="00"></span>
        </span>
      </div>
    </div>

    <!-- Minutes Section -->
    <div class="flip-clock__piece">
      <div class="flip-clock__slot">Minutes</div>
      <div class="card flip">
        <span class="card__top" data-value="00">00</span>
        <span class="card__bottom" data-value="00"></span>
        <span class="card__back">
          <span class="card__bottom" data-value="00"></span>
        </span>
      </div>
    </div>

    <!-- Seconds Section -->
    <div class="flip-clock__piece">
      <div class="flip-clock__slot">Seconds</div>
      <div class="card flip">
        <span class="card__top" data-value="00">00</span>
        <span class="card__bottom" data-value="00"></span>
        <span class="card__back">
          <span class="card__bottom" data-value="00"></span>
        </span>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
